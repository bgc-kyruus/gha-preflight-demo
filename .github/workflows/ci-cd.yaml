name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  preflight:
    uses: ./.github/workflows/pre-flight.yaml
    with:
      env-config: ".github/preflight/env-config.yaml"

  test:
    runs-on: ubuntu-latest
    needs: preflight
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip PyYAML pytest
      - run: pytest tests/ || echo "No tests found"

  docker_build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}  # <-- Personal Access Token

      - name: Build and push Docker image
        run: |
          IMAGE_SHA=${{ secrets.DOCKER_USERNAME }}/demo-app:${{ github.sha }}
          IMAGE_LATEST=${{ secrets.DOCKER_USERNAME }}/demo-app:latest
          
          # Build image with commit SHA tag
          docker build -f .github/Dockerfile -t $IMAGE_SHA -t $IMAGE_LATEST .
          
          # Push both tags
          docker push $IMAGE_SHA
          docker push $IMAGE_LATEST

  deploy:
    runs-on: ubuntu-latest
    needs: docker_build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: preflight-manifest
          path: build/artifacts

      - name: Deploy (example)
        run: |
          echo "Deploy completed. Images pushed: ${{ secrets.DOCKER_USERNAME }}/demo-app:${{ github.sha }} and latest"

