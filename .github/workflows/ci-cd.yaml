name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  preflight:
    uses: ./.github/workflows/pre-flight.yaml
    with:
      env-config: ".github/preflight/env-config.yaml"

  test:
    runs-on: ubuntu-latest
    needs: preflight
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip PyYAML pytest
      - run: pytest tests/ || echo "No tests found"

  docker_build_ecr:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      # Configure AWS using OIDC
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::768843312651:role/GitHubActionsECRDeployRole
          aws-region: us-west-2

      # Create ECR repository if it doesn't exist
      - name: Create ECR repository if it doesn't exist
        run: |
          aws ecr describe-repositories --repository-names gha-preflight-demo || \
          aws ecr create-repository --repository-name gha-preflight-demo

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: gha-preflight-demo
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -f .github/Dockerfile -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

  deploy_ecs:
    runs-on: ubuntu-latest
    needs: docker_build_ecr
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      # Configure AWS using OIDC
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::768843312651:role/GitHubActionsECRDeployRole
          aws-region: us-west-2

      - name: Render new ECS task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: .github/ecs-task-def.json
          container-name: gha-preflight-demo
          image: ${{ steps.login-ecr.outputs.registry }}/gha-preflight-demo:${{ github.sha }}

      - name: Deploy to Amazon ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: gha-preflight-demo-service
          cluster: gha-preflight-demo-cluster
          wait-for-service-stability: true

